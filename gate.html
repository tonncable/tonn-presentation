<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonn Cable — Access</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23120A12'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23CB0A7C'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23E8743B'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(ellipse at 30% 30%, rgba(203,10,124,.35) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 70%, rgba(138,10,92,.4) 0%, transparent 50%),
      #1a0512;
    color:#15151c;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .gate{
    width:100%;max-width:440px;
    background:#fff;
    border-radius:20px;
    padding:48px 44px 36px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.35);
  }
  .gate__logo{margin-bottom:4px;display:flex;justify-content:center}
  .gate__logo img{max-width:200px;height:auto;display:block}
  .gate__title{font-size:26px;font-weight:800;letter-spacing:-.01em;color:#15151c;margin-bottom:6px}
  .gate__sub{font-size:14px;color:#8a8590;margin-bottom:28px}
  .gate__form{display:flex;flex-direction:column;gap:8px;text-align:left}
  .gate__label{font-size:14px;font-weight:700;color:#15151c;margin-bottom:4px;margin-top:8px}
  .gate__field{position:relative}
  .gate__input{
    width:100%;padding:14px 44px 14px 16px;
    background:#fff;
    border:1.5px solid #f5c8dd;
    border-radius:10px;
    color:#15151c;font-size:15px;font-family:inherit;
    outline:none;transition:border-color .2s;
  }
  .gate__input:focus{border-color:#CB0A7C}
  .gate__input::placeholder{color:#c9c3ce}
  .gate__eye{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    background:none;border:0;cursor:pointer;padding:4px;
    color:#a09aa8;display:flex;align-items:center;
  }
  .gate__eye:hover{color:#CB0A7C}
  .gate__eye svg{width:20px;height:20px}
  .gate__btn{
    width:100%;padding:14px 20px;margin-top:20px;
    background:linear-gradient(180deg,#CB0A7C 0%,#8A0A5C 100%);
    border:0;border-radius:10px;
    color:#fff;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;
    transition:transform .12s,box-shadow .2s,filter .2s;
  }
  .gate__btn:hover{filter:brightness(1.05);box-shadow:0 10px 24px rgba(203,10,124,.35)}
  .gate__btn:active{transform:translateY(1px)}
  .gate__err{
    color:#e11436;font-size:13px;font-weight:600;
    text-align:center;margin-top:12px;min-height:18px;
    opacity:0;transition:opacity .2s;
  }
  .gate__err.show{opacity:1}
  .gate__hint{margin-top:18px;font-size:12px;color:#a09aa8}
</style>
</head>
<body>
  <div class="gate">
    <div class="gate__logo">
      <img src="assets/img/image2.png" alt="Tonn Cable">
    </div>
    <h1 class="gate__title">Welcome back</h1>
    <p class="gate__sub">Sign in to the Tonn Cable presentation</p>
    <form class="gate__form" id="gateForm">
      <label class="gate__label" for="gatePw">Password</label>
      <div class="gate__field">
        <input type="password" class="gate__input" id="gatePw" placeholder="Your password" autocomplete="off" autofocus required>
        <button type="button" class="gate__eye" id="gateEye" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" class="gate__btn">Continue</button>
      <div class="gate__err" id="gateErr">Incorrect password. Try again.</div>
    </form>
    <div class="gate__hint">Access limited to invited viewers</div>
  </div>

<script>
(function(){
  var PASSWORD = 'tonn2025';
  var TOKEN_KEY = 'tonn_gate_ok';
  var TOKEN_VAL = 'tonn:' + PASSWORD;

  try {
    if (sessionStorage.getItem(TOKEN_KEY) === TOKEN_VAL) {
      location.replace('index.html');
      return;
    }
  } catch(e){}

  var form = document.getElementById('gateForm');
  var pw = document.getElementById('gatePw');
  var err = document.getElementById('gateErr');
  var eye = document.getElementById('gateEye');

  eye.addEventListener('click', function(){
    pw.type = pw.type === 'password' ? 'text' : 'password';
    pw.focus();
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (pw.value === PASSWORD) {
      try { sessionStorage.setItem(TOKEN_KEY, TOKEN_VAL); } catch(e){}
      location.replace('index.html');
    } else {
      err.classList.add('show');
      pw.value = '';
      pw.focus();
      setTimeout(function(){ err.classList.remove('show'); }, 2400);
    }
  });
})();
</script>
</body>
</html>
