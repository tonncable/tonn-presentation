<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin · Project References</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--magenta:#A50064;--fg:#15151c;--muted:#57525d;--hair:rgba(0,0,0,.10);--bg:#f7f5f8}
    html,body{background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
    .top{background:#fff;border-bottom:1px solid var(--hair);padding:14px 24px;display:flex;align-items:center;gap:16px}
    .top h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta);font-weight:900}
    .top .who{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
    .top .out{padding:6px 14px;background:transparent;border:1.5px solid var(--hair);color:var(--fg);border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
    .top .out:hover{border-color:var(--magenta);color:var(--magenta)}
    .wrap{max-width:900px;margin:0 auto;padding:30px 20px 60px}
    .login{max-width:420px;margin:80px auto;padding:36px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(20,10,20,.08)}
    .login h2{font-size:22px;font-weight:900;margin-bottom:6px;color:var(--fg)}
    .login p{font-size:13px;color:var(--muted);margin-bottom:22px;font-weight:500}
    .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .fld label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .fld input{padding:12px 14px;border:1.5px solid rgba(20,10,20,.08);border-radius:12px;font-family:inherit;font-size:14px;background:#fafafa;outline:none;transition:all .16s}
    .fld input:focus{border-color:var(--magenta);box-shadow:0 0 0 4px rgba(165,0,100,.08);background:#fff}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--magenta),#7a0049);color:#fff;border:0;border-radius:12px;font-family:inherit;font-size:14px;font-weight:800;letter-spacing:.02em;cursor:pointer;transition:transform .16s,box-shadow .16s;box-shadow:0 4px 14px rgba(165,0,100,.24)}
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(165,0,100,.36)}
    .err{color:#c00040;font-size:13px;font-weight:700;padding:10px 12px;background:rgba(200,0,64,.06);border-left:3px solid #c00040;border-radius:6px;margin-bottom:12px}
    .toolbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
    .toolbar h2{font-size:22px;font-weight:900;color:var(--fg);letter-spacing:-.01em}
    .toolbar .cnt{font-size:13px;color:var(--muted);font-weight:600}
    .card{background:#fff;border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 4px 16px rgba(20,10,20,.05);border:1px solid rgba(20,10,20,.04)}
    .card__hdr{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--hair)}
    .card__name{font-size:18px;font-weight:900;color:var(--fg);letter-spacing:-.005em}
    .card__meta{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-align:right}
    .card__meta b{color:var(--fg);font-weight:800}
    .row{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13px;color:var(--fg);margin-bottom:10px}
    .row b{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-right:6px}
    .cbls{background:#faf7fa;border-left:3px solid var(--magenta);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:8px;margin-bottom:14px}
    .cbls b{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--magenta);display:block;margin-bottom:6px}
    .cbls ul{list-style:disc;padding-left:20px}
    .cbls li{padding:2px 0;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sector-warn{display:inline-block;padding:2px 8px;border-radius:99px;background:#fff2b8;color:#7a5a00;font-size:11px;font-weight:800;margin-left:8px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .act{flex:1;min-width:120px;padding:12px 16px;border:0;border-radius:10px;font-family:inherit;font-size:14px;font-weight:800;letter-spacing:.02em;cursor:pointer;transition:transform .14s,box-shadow .14s;display:flex;align-items:center;justify-content:center;gap:6px}
    .act:hover:not(:disabled){transform:translateY(-1px)}
    .act:disabled{opacity:.5;cursor:wait}
    .act--ok{background:linear-gradient(135deg,#25D366,#128C4B);color:#fff;box-shadow:0 4px 14px rgba(18,140,75,.22)}
    .act--no{background:#fff;border:1.5px solid #e0dce4;color:var(--muted)}
    .act--no:hover:not(:disabled){border-color:#c00040;color:#c00040}
    .sector-fix{display:flex;align-items:center;gap:8px;margin-bottom:14px}
    .sector-fix label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .sector-fix select{padding:8px 12px;border:1.5px solid rgba(20,10,20,.1);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;font-weight:600;cursor:pointer;outline:none}
    .sector-fix select:focus{border-color:var(--magenta)}
    .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;font-weight:600}
    .empty .ico{font-size:48px;margin-bottom:16px;opacity:.4}
    .config-warn{padding:20px;background:#fff2b8;border-left:4px solid #d4a017;border-radius:8px;margin-bottom:20px}
    .config-warn b{color:#7a5a00}
    .config-warn code{background:#fff;padding:2px 6px;border-radius:4px;font-family:ui-monospace,monospace;font-size:12px}
    a{color:var(--magenta)}
  </style>
</head>
<body>
  <header class="top">
    <h1>Admin · Project Submissions</h1>
    <span class="who" id="who"></span>
    <button class="out" id="btnOut" hidden>Sign out</button>
  </header>

  <div class="wrap">
    <div id="configWarn" class="config-warn" hidden>
      <b>Firebase not configured yet.</b><br>
      Edit <code>projects/firebase-config.js</code> and fill in your project credentials.
      See <code>FIREBASE-SETUP.md</code> for the step-by-step.
    </div>

    <div id="loginBox" class="login" hidden>
      <h2>Admin sign in</h2>
      <p>Only authorised staff can approve submissions.</p>
      <p id="loginErr" class="err" hidden></p>
      <div class="fld"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@tonncable.com"></div>
      <div class="fld"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn" id="btnIn">Sign in →</button>
    </div>

    <div id="dashboard" hidden>
      <div class="toolbar">
        <h2>Pending submissions</h2>
        <div class="cnt" id="pendCnt"></div>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
    const SECTORS = ['Data Centre','Telecom','Infrastructure','Utility','Oil & Gas','Industrial','Commercial','Retail','Residential','Hospitality','Government','Healthcare','Education','Sports & Recreation','Religious'];
    const cfg = window.FIREBASE_CONFIG || {};
    const configured = cfg.apiKey && cfg.apiKey !== 'YOUR_API_KEY';
    if (!configured){
      document.getElementById('configWarn').hidden = false;
    } else {
      firebase.initializeApp(cfg);
      const auth = firebase.auth();
      const db = firebase.firestore();
      const loginBox = document.getElementById('loginBox');
      const dashboard = document.getElementById('dashboard');
      const btnOut = document.getElementById('btnOut');
      const who = document.getElementById('who');
      const loginErr = document.getElementById('loginErr');

      auth.onAuthStateChanged(user => {
        const isAdmin = user && (window.ADMIN_EMAILS || []).includes(user.email);
        if (isAdmin){
          who.textContent = user.email;
          btnOut.hidden = false;
          loginBox.hidden = true;
          dashboard.hidden = false;
          loadPending();
        } else {
          if (user && !isAdmin){ auth.signOut(); loginErr.textContent = 'This account is not authorised.'; loginErr.hidden = false; }
          who.textContent = ''; btnOut.hidden = true;
          loginBox.hidden = false; dashboard.hidden = true;
        }
      });
      document.getElementById('btnIn').addEventListener('click', async () => {
        const e = document.getElementById('email').value.trim();
        const p = document.getElementById('pw').value;
        loginErr.hidden = true;
        try { await auth.signInWithEmailAndPassword(e, p); }
        catch(err){ loginErr.textContent = err.message; loginErr.hidden = false; }
      });
      document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnIn').click(); });
      btnOut.addEventListener('click', () => auth.signOut());

      async function loadPending(){
        const list = document.getElementById('list');
        const cnt = document.getElementById('pendCnt');
        list.innerHTML = '<div class="empty">Loading…</div>';
        try {
          const snap = await db.collection('pending_projects').orderBy('submittedAt','desc').get();
          const docs = snap.docs;
          cnt.textContent = docs.length ? `${docs.length} awaiting your review` : '';
          if (!docs.length){ list.innerHTML = '<div class="empty"><div class="ico">📭</div>All caught up! No pending submissions.</div>'; return; }
          list.innerHTML = docs.map(d => renderCard(d.id, d.data())).join('');
          list.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', () => approve(b.dataset.approve)));
          list.querySelectorAll('[data-decline]').forEach(b => b.addEventListener('click', () => decline(b.dataset.decline)));
        } catch(err){
          list.innerHTML = `<div class="err">Could not load: ${err.message}</div>`;
        }
      }

      function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      function renderCard(id, d){
        const cables = (d.details || '').split('|').map(s => s.trim()).filter(Boolean);
        const when = d.submittedAt && d.submittedAt.toDate ? d.submittedAt.toDate().toLocaleString() : '';
        const sectorTBC = !d.sector || d.sector.includes('TBC');
        const sectorSelect = `<select data-secfor="${id}">${SECTORS.map(s => `<option${s === d.sector ? ' selected' : ''}>${s}</option>`).join('')}</select>`;
        return `
        <div class="card" data-id="${id}">
          <div class="card__hdr">
            <div class="card__name">${esc(d.name)}${sectorTBC ? '<span class="sector-warn">Sector needs review</span>' : ''}</div>
            <div class="card__meta">by <b>${esc(d.submittedBy||'unknown')}</b><br>${esc(when)}</div>
          </div>
          <div class="sector-fix"><label>Sector:</label>${sectorSelect}</div>
          <div class="row"><span><b>Country</b>${esc(d.country||'Malaysia')}</span><span><b>Location</b>${esc(d.location||'')}</span>${d.year ? `<span><b>Year</b>${esc(d.year)}</span>` : ''}${d.dealer ? `<span><b>Dealer</b>${esc(d.dealer)}</span>` : ''}</div>
          ${cables.length ? `<div class="cbls"><b>Cables (${cables.length})</b><ul>${cables.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
          <div class="actions">
            <button class="act act--ok" data-approve="${id}">✓ Approve & publish</button>
            <button class="act act--no" data-decline="${id}">✕ Decline</button>
          </div>
        </div>`;
      }

      async function approve(id){
        const card = document.querySelector(`.card[data-id="${id}"]`);
        const btns = card.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
        try {
          const doc = await db.collection('pending_projects').doc(id).get();
          if (!doc.exists) throw new Error('Already gone');
          const data = doc.data();
          const secSel = card.querySelector('select[data-secfor]');
          const finalSector = secSel ? secSel.value : data.sector;
          const live = { ...data, sector: finalSector, approvedAt: firebase.firestore.FieldValue.serverTimestamp(), approvedBy: firebase.auth().currentUser.email };
          delete live.submittedAt; // don't need the pending timestamp in live copy
          await db.collection('live_projects').add(live);
          await db.collection('pending_projects').doc(id).delete();
          card.style.transition = 'opacity .3s'; card.style.opacity = 0;
          setTimeout(loadPending, 320);
        } catch(err){ alert('Approve failed: ' + err.message); btns.forEach(b => b.disabled = false); }
      }
      async function decline(id){
        if (!confirm('Decline and delete this submission? This cannot be undone.')) return;
        const card = document.querySelector(`.card[data-id="${id}"]`);
        const btns = card.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
        try {
          await db.collection('pending_projects').doc(id).delete();
          card.style.transition = 'opacity .3s'; card.style.opacity = 0;
          setTimeout(loadPending, 320);
        } catch(err){ alert('Decline failed: ' + err.message); btns.forEach(b => b.disabled = false); }
      }
    }
  </script>
</body>
</html>
